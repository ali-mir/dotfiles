set -g default-command "${SHELL}"
set -g history-limit 500000
set -s escape-time 0
set -g mouse on

# show full session name in status bar
set -g status-left-length 50

# start numbering from 1 (matches ws picker)
set -g base-index 1
set -g pane-base-index 1

# remap prefix from 'C-b' to 'C-a'
set -g prefix C-a
